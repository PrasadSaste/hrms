name: Bysure HRMS CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: bysurehrms


permissions:
  contents: read


jobs:

  # ============================================================
  # 1. PHP TESTS
  # ============================================================

  tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom,curl,libxml,mbstring,zip,pcntl,pdo,sqlite,pdo_sqlite,pdo_mysql,intl,gd
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test


  # ============================================================
  # 2. MYSQL MIGRATION TEST
  # ============================================================

  mysql:
    name: MySQL 8 Migration Test
    runs-on: ubuntu-latest

    needs: tests

    services:

      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrms_bysure

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom,curl,libxml,mbstring,zip,pcntl,pdo,pdo_mysql,intl,gd
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run MySQL migrations and seed
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_bysure
          DB_USERNAME: root
          DB_PASSWORD: root
          SEED_DEMO_DATA: 'true'

        run: |
          php artisan migrate:fresh --seed --force


  # ============================================================
  # 3. FRONTEND BUILD
  # ============================================================

  assets:
    name: Build Frontend Assets
    runs-on: ubuntu-latest

    needs: tests

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify Vite manifest
        run: |
          test -f public/build/manifest.json

      - name: Upload frontend assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-assets
          path: public/build


  # ============================================================
  # 4. LARASTAN STATIC ANALYSIS
  # ============================================================

  larastan:
    name: Larastan Analysis
    runs-on: ubuntu-latest

    needs:
      - tests
      - mysql
      - assets

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom,curl,libxml,mbstring,zip,pcntl,pdo,pdo_mysql,intl,gd
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Run Larastan
        run: vendor/bin/phpstan analyse


  # ============================================================
  # 5. PSALM STATIC ANALYSIS
  # ============================================================

  psalm:
    name: Psalm Analysis
    runs-on: ubuntu-latest

    needs:
      - tests
      - mysql
      - assets

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom,curl,libxml,mbstring,zip,pcntl,pdo,pdo_mysql,intl,gd
          coverage: none

      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Run Psalm
        run: vendor/bin/psalm


  # ============================================================
  # 6. TRIVY FILESYSTEM SECURITY SCAN
  # ============================================================

  security-scan:
    name: Trivy Filesystem Security Scan
    runs-on: ubuntu-latest

    needs:
      - tests
      - assets

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-results.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Upload Trivy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.json
