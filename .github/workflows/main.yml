name: Tests

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: mysql

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, pdo_mysql, intl, gd
        coverage: none

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-interaction --no-progress

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm

    - name: Install Node dependencies
      run: npm ci

    - name: Build Vite assets
      run: npm run build

    - name: Prepare environment
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Run the test suite
      run: php artisan test

  mysql:
    name: Migrations on MySQL 8
    runs-on: ubuntu-latest
    needs: assets

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrms_bysure
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate and seed against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_bysure
          DB_USERNAME: root
          DB_PASSWORD: root
          SEED_DEMO_DATA: 'true'
        run: |
          php artisan migrate:fresh --seed --force
          
  assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install and build
        run: |
          npm ci
          npm run build

  sonarqubescan:
   name: sonarscanner
   runs-on: ubuntu-latest
   needs:
     - assets
     - mysql
     - tests

   steps:
     - name: sonarqube scan
       uses: SonarSource/sonarqube-scan-action@v6
       env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
         SONAR_URL: ${{ secrets.SONAR_URL }}
     
     - name: SonarQube Quality Gate
       uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
       timeout-minutes: 5
       env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
