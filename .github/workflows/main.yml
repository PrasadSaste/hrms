name: Laravel CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  ci:
    name: Application Validation
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      # 3. Validate composer.json
      - name: Validate Composer
        run: composer validate --strict

      # 4. Install dependencies
      - name: Install Composer dependencies
        run: |
          composer install \
            --prefer-dist \
            --no-interaction \
            --no-progress

      # 5. Laravel environment
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # 6. PHP syntax check
      - name: PHP Syntax Check
        run: |
          find app config routes database tests \
            -type f -name "*.php" \
            -print0 | xargs -0 -n1 php -l

      # 7. Laravel application check
      - name: Laravel Application Check
        run: php artisan about

      # 8. Run tests
      - name: Run Laravel Tests
        run: php artisan test
  mysql:
    name: Migrations on MySQL 8
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hrms_bysure
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, intl, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Migrate and seed against MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hrms_bysure
          DB_USERNAME: root
          DB_PASSWORD: root
          SEED_DEMO_DATA: 'true'
        run: |
          php artisan migrate:fresh --seed --force
          
  assets:
    name: Build assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: Install and build
        run: |
          npm ci
          npm run build

